name: CI

on:
  push:
    branches: [master]
  pull_request:

# Least-privilege default: this workflow only reads the repo and uploads a
# build artifact, so the GITHUB_TOKEN needs no other scope.
permissions:
  contents: read

jobs:
  test:
    name: Lint, security scan, and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39 # v3
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install

      - name: Install dependencies (from uv.lock)
        run: uv sync --extra dev --locked

      - name: Lint (ruff)
        run: uv run ruff check triad/

      - name: Security scan (bandit)
        run: uv run bandit -r triad/ -x triad/tests,triad/bench/.cache --severity-level medium

      - name: Compile check
        run: uv run python -m compileall -q triad

      - name: Test suite with coverage (parallel via pytest-xdist)
        run: uv run pytest triad/tests -v -n auto --dist=loadfile --cov=triad --cov-report=term-missing --cov-report=xml

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-report
          path: coverage.xml
