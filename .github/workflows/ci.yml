name: CI

on:
  push:
    branches: [master]
  pull_request:

# Least-privilege default: this workflow only reads the repo and uploads a
# build artifact, so the GITHUB_TOKEN needs no other scope.
permissions:
  contents: read

jobs:
  test:
    name: Lint, security scan, and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install

      - name: Install dependencies (from uv.lock)
        run: uv sync --extra dev --locked

      - name: Lint (ruff)
        run: uv run ruff check triad/

      - name: Security scan (bandit)
        run: uv run bandit -r triad/ -x triad/tests,triad/bench/.cache --severity-level medium

      - name: Compile check
        run: uv run python -m compileall -q triad

      - name: Test suite with coverage (parallel via pytest-xdist)
        run: uv run pytest triad/tests -v -n auto --dist=loadfile --cov=triad --cov-report=term-missing --cov-report=xml

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-report
          path: coverage.xml
