name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    name: Lint, security scan, and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install

      - name: Install dependencies (from uv.lock)
        run: uv sync --extra dev --locked

      - name: Lint (ruff)
        run: uv run ruff check triad/

      - name: Security scan (bandit)
        run: uv run bandit -r triad/ -x triad/tests --severity-level medium

      - name: Compile check
        run: uv run python -m py_compile $(find triad -name '*.py')

      - name: Test suite with coverage
        run: uv run pytest triad/tests -v --cov=triad --cov-report=term-missing --cov-report=xml

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
